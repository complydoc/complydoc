[project]
name = "complydoc"
dynamic = ["version"]
description = "Check documents before they reach an LLM: token cost, extraction readiness, identifiers, hidden text and prompt injection."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Duarte Cardoso", email = "caldasdcardoso@gmail.com" }]
keywords = ["pdf", "ocr", "pii", "prompt-injection", "langchain", "document-loaders", "llm", "offline"]

# How the package is filed and found on PyPI. Kept to the ones that are true:
# a long list of aspirational classifiers is noise on the page.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pillow>=10.3",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "tiktoken>=0.7",
    "py3langid>=0.4.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
ner = ["spacy>=3.7"]
# Names in the languages these documents are written in. Heavier than `ner` by
# an order of magnitude, and measurably better at them: see Detection accuracy.
multilingual-names = ["transformers>=4.40", "torch>=2.2"]
# A hosted judgement service for passages that read as instructions to a model.
# Off unless the caller asks for it: it sends text off the machine, which is the
# one thing the rest of this tool is built not to do.
# Through LangChain's TypeSafe integration, an alpha: the floor is the release this
# was written against.
typesafe = ["langchain-typesafe>=0.0.1a3"]
# `complydoc assist`: drafts quick wins from a finished report with a hosted
# chat model. Off unless the caller asks for it, same as `typesafe` above — it
# sends the whole report off the machine.
assistant = ["langchain>=1.0", "langchain-openai>=0.3"]
notebook = ["pandas>=2.1"]

[project.scripts]
complydoc = "complydoc.cli:app"

# Rendered as links down the side of the PyPI page.
[project.urls]
Homepage = "https://github.com/complydoc/complydoc"
Repository = "https://github.com/complydoc/complydoc"
Changelog = "https://github.com/complydoc/complydoc/blob/main/src/complydoc/CHANGELOG.md"
Issues = "https://github.com/complydoc/complydoc/issues"

[dependency-groups]
# Loaders from other frameworks, for the tests that run them for real. Kept out
# of `dev` because it is fifty-odd packages the tool itself never imports.
# LangChain's loaders now come as standalone packages; `langchain-community` was
# archived in June 2026 and stays here only so the migration guide can compare its
# PyPDFLoader with a replacement.
integrations = [
    "langchain-pymupdf4llm>=1.28",
    "langchain-community>=0.3",
    "docx2txt>=0.8",
    "llama-index-core>=0.12",
]
# The documentation site. Separate from `dev` because building the docs needs
# none of the test machinery and running the tests needs none of this.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "reportlab>=4.2",
    "python-pptx>=1.0",
    "pandas>=2.1",
    "types-pyyaml>=6.0",
    "cyclonedx-bom>=7.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One source of truth for the version: the report records it, so the package and
# the tool must never disagree about what ran.
[tool.hatch.version]
path = "src/complydoc/__init__.py"

[tool.hatch.build]
# The built viewer `complydoc ui` serves. Generated by `make viewer-bundle`, so it
# is ignored by git, and named here so the wheel and sdist carry it anyway.
artifacts = ["src/complydoc/viewer/dist/"]

[tool.hatch.build.targets.wheel]
packages = ["src/complydoc"]

[tool.hatch.build.targets.wheel.force-include]
"src/complydoc/skill/SKILL.md" = "complydoc/skill/SKILL.md"

[tool.hatch.build.targets.sdist]
# The React viewer's source is a separate app with its own toolchain; the package
# carries only its build, in src/complydoc/viewer/dist. The landing page is the
# website's, not the package's.
exclude = ["/viewer", "/landing"]

[[tool.mypy.overrides]]
# Not a dependency: the tesseract engine is there for anyone who already has it
# installed, and complydoc will not make everyone carry a system binary for it.
module = ["pytesseract"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
# Ruff formats the Python inside Markdown code blocks, which is usually a gift
# and is wrong here: the guides include their examples with a snippet directive
# (`--8<-- "..."`) that sits inside a ```python fence so it renders highlighted.
# Ruff reads that as an expression and rewrites it to `--8 < --"..."`, which is
# valid Python and a broken include. The examples themselves are real .py files
# and are linted; the fences only point at them.
extend-exclude = ["*.md"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The diagram generator emits SVG markup; long lines are inherent to it.
"src/scripts/build_diagram.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["complydoc", "tests"]

[tool.mypy]
# No python_version pin: mypy then uses the running interpreter, which keeps it
# in step with the stubs its dependencies ship.
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pdfplumber.*",
    "pypdfium2.*",
    "rapidocr_onnxruntime.*",
    "spacy.*",
    "torch.*",
    "transformers.*",
    "tiktoken.*",
    "docx.*",
    "openpyxl.*",
    "py3langid.*",
    "reportlab.*",
    "lxml",
    "lxml.*",
    "pandas",
    "langchain.*",
    "langchain_core.*",
    "langchain_openai.*",
    "llama_index.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "requires_ocr: needs the optional [ocr] extra installed",
    "requires_ner: needs the optional [ner] extra installed",
]

[[tool.mypy.overrides]]
# These subclass a base from an optional framework. Where the framework is not
# installed the base is Any and subclassing it needs the ignore; where it is
# installed the base resolves and the ignore reads as unused. Both environments
# are real — the type check runs without those packages and the tests run with
# them — so the ignore stays and the warning about it does not.
module = ["complydoc.integrations.langchain", "complydoc.integrations.llamaindex"]
warn_unused_ignores = false
