<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>complydoc: observability for AI ingestion pipelines</title>
    <meta
      name="description"
      content="complydoc is the observability layer for AI ingestion pipelines: a trace of every step from your documents to your vector store, with what each step cost, how long it took, what it extracted and which identifiers it let through. Open source, runs on your machine."
    />
    <!-- Set the theme before the first paint, so a dark reader never sees a white flash. -->
    <script>
      try {
        const t = localStorage.getItem("complydoc-theme");
        const dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
    <!-- Visits are counted without cookies and nothing is stored in the browser. -->
    <script data-goatcounter="https://complydoc.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
