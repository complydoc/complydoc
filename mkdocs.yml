# The documentation site.
#
# The rule this is built on: generate everything that can be generated. The CLI
# reference comes from the Typer app, the Python API from the docstrings, the
# report shape from the code that defines it, and the configuration from the
# models that validate it. Nothing in `reference/` is written by hand, so none
# of it can drift from what the tool does.
#
# What is written by hand is the part a machine cannot produce: what to do, and
# why it works the way it does. Every example in a guide is a real file under
# `docs/examples`, included here and executed by the test suite, so a guide that
# stops working fails the build.

site_name: complydoc
site_description: >-
  The observability layer for AI ingestion pipelines.
site_url: https://complydoc.github.io/complydoc/docs/
repo_url: https://github.com/complydoc/complydoc
repo_name: complydoc/complydoc
edit_uri: edit/main/docs/
copyright: MIT licensed

theme:
  name: material
  logo: assets/mark.svg
  favicon: assets/favicon.svg
  font:
    text: Geist
    code: Geist Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/complydoc.css

plugins:
  - search
  - gen-files:
      scripts:
        - docs/generate.py
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            members_order: source
            docstring_style: google
            separate_signature: true
            signature_crossrefs: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true

nav:
  - Home: index.md
  - Observe:
      - Observing a pipeline: guides/observe-a-pipeline.md
      - The report viewer: guides/viewer.md
      - Inspecting a loader: guides/inspect-a-loader.md
      - Comparing loaders: guides/compare-loaders.md
      - Inspecting chunks: guides/inspect-chunks.md
      - Replacing a langchain-community loader: guides/replace-langchain-community.md
  - Audit:
      - Audit a folder: guides/audit-a-folder.md
      - Page routing: guides/routing.md
      - Verifying pages with a vision model: guides/verify-with-vision.md
      - Extracting masked text: guides/extract-masked-text.md
      - Report tables: guides/report-tables.md
      - Safe copies: guides/clean.md
  - Security:
      - Ignoring findings: guides/ignore-findings.md
      - Your own concepts: guides/custom-concepts.md
      - Name detection models: guides/name-detection-models.md
      - Drafting quick wins: guides/assist.md
  - CI and code:
      - Python API: guides/python-api.md
      - Streaming and steps: guides/streaming-and-steps.md
      - Baselines and tests: guides/baselines-and-tests.md
      - Policy files: guides/policy.md
      - GitHub Action: guides/github-action.md
  - Reference:
      - Command line: reference/cli.md
      - Python API: reference/api.md
      - Report JSON: reference/report.md
      - Configuration: reference/configuration.md
      - Identifiers: reference/identifiers.md
  - How it works:
      - Network isolation: explanation/offline.md
      - Unmeasured values: explanation/not-measured.md
      - Evidence tiers: explanation/evidence.md
      - Hidden content: explanation/hidden-content.md
      - Detection accuracy: explanation/accuracy.md

not_in_nav: |
  examples/

# Design notes are proposals for discussion, kept beside the docs but not published.
exclude_docs: |
  design/
