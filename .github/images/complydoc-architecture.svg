  <title id="complydoc-architecture-title">complydoc architecture</title>
  <desc id="complydoc-architecture-desc">Files are read by per-format readers and loader output is taken as it is; both feed four independent analyses (cost, readiness, identifiers, hidden content), configured by YAML, which produce an HTML and JSON report and masked text, all inside a network guard that blocks outbound connections.</desc>
