# Dependency updates, as pull requests into development. Grouped, so that a week brings
# one pull request per ecosystem rather than one per package.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/viewer", "/landing", "/docs-site"]
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: development
    schedule:
      interval: weekly
