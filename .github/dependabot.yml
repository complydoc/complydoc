# Dependency updates, as pull requests into development. Grouped, so that a week brings
# one pull request per ecosystem rather than one per package.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/viewer", "/landing", "/docs-site"]
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint does not accept TypeScript 7 yet; move it with typescript-eslint.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    ignore:
      # Node majors move by hand, to the next LTS line: Dependabot offers odd, short-lived ones too.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
