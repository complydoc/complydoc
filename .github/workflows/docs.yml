# Build the site and publish it to GitHub Pages: the landing page at the root and
# the documentation under docs/. A repository gets one Pages site, so the two
# share it; src/scripts/assemble_site.py puts them together and leaves a
# redirect at every address the documentation had when it was the root.
#
# Publishing happens from `main` only. Every pull request still builds the site
# under `--strict`, so a broken link or a reference page that stops generating
# fails the pull request.
#
# The reference pages are generated from the code at build time, so this
# workflow installs the package as well as the documentation toolchain.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "landing/**"
      - "src/scripts/assemble_site.py"
      - "mkdocs.yml"
      - "src/complydoc/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "landing/**"
      - "src/scripts/assemble_site.py"
      - "mkdocs.yml"
      - "src/complydoc/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group docs
      - name: build the documentation
        run: uv run mkdocs build --strict
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: build the landing page
        working-directory: landing
        run: npm ci && npm run build
      - name: assemble the site
        run: uv run python src/scripts/assemble_site.py --docs site --landing landing/dist --out _site
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  publish:
    name: publish to Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
