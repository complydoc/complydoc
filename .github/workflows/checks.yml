name: checks

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  # Copied, not hardlinked: NLTK, which LlamaIndex's sentence splitter uses, refuses to
  # open data files with more than one link.
  UV_LINK_MODE: copy

jobs:
  viewer:
    name: viewer (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  browser:
    # The built viewer driven in Chrome, on demo reports: a page that stops answering, or a
    # control something covers, fails here. Tests in jsdom have shown neither.
    name: viewer in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: make browser-check

  landing:
    name: landing page (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra ocr --extra ner --group dev --group docs
      # The same commands `make lint` and `make types` run locally.
      - name: ruff
        run: uv run ruff check src/complydoc src/tests
      - name: format
        run: uv run ruff format --check src/complydoc src/tests
      - name: mypy
        run: uv run mypy src/complydoc

  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --extra ocr --group dev
      - name: tests
        run: uv run pytest -q

  test-ner:
    name: tests with the local NER model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra ocr --extra ner --group dev
      # Downloading the model is a build step. complydoc itself never reaches
      # the network, which the offline guard tests assert on every run.
      - run: uv run python -m spacy download en_core_web_sm
      - name: tests
        run: uv run pytest -q

  test-integrations:
    name: tests with LangChain loaders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra ocr --extra typesafe --group dev --group integrations
      - name: tests
        run: uv run pytest -q

  test-pipelines:
    name: tests with real ingestion pipelines
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ~/.cache/fastembed
      # Only where the repository has the secret: the test that calls OpenAI skips without it.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      # The embedding model the pipelines run, downloaded once.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: uv sync --extra ocr --group dev --group integrations --group pipelines
      - name: tests
        run: uv run pytest -q src/tests/test_real_pipelines.py src/tests/test_observe.py

  fixtures:
    name: fixtures match their generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: regenerate into a scratch directory
        run: uv run python src/tests/generate_fixtures.py --out "${RUNNER_TEMP}/fixtures"
      # The fixtures are committed so the suite does not depend on a PDF
      # writer's output staying byte-stable. This checks the generator still
      # produces every document the suite expects to find.
      - name: every committed fixture is still generated
        run: |
          uv run python - "${RUNNER_TEMP}/fixtures" <<'PY'
          import pathlib, sys
          made = {p.name for p in pathlib.Path(sys.argv[1]).iterdir()}
          want = {p.name for p in pathlib.Path("src/tests/fixtures").iterdir()}
          missing = sorted(want - made)
          if missing:
              sys.exit(f"the generator no longer produces: {missing}")
          print(f"{len(want)} fixtures accounted for")
          PY
  image:
    name: the container image audits and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: build the plain image and the one with a name model
        run: |
          docker buildx build --load -t complydoc:ci -t complydoc .
          docker buildx build --load -t complydoc:ci-names --target names .
      - name: it runs as its own user and says its version
        run: |
          test "$(docker run --rm --entrypoint id complydoc:ci -u)" = 1000
          # What reading and writing a bucket needs is in both images.
          docker run --rm --entrypoint python complydoc:ci -c "import boto3"
          docker run --rm --entrypoint python complydoc:ci-names -c "import boto3"
          docker run --rm complydoc:ci --version
      # No network at all, as in a locked-down environment: an audit must not need one.
      - name: audit the sample documents, with no network
        run: |
          mkdir -p "$RUNNER_TEMP/reports" && chmod 777 "$RUNNER_TEMP/reports"
          docker run --rm --network none \
            -v "$PWD/src/complydoc/sample:/documents:ro" -v "$RUNNER_TEMP/reports:/reports" \
            complydoc:ci audit /documents --out /reports -q
          test -s "$RUNNER_TEMP/reports/complydoc.json"
      - name: the name model finds names, with no network
        run: |
          mkdir -p "$RUNNER_TEMP/names" && chmod 777 "$RUNNER_TEMP/names"
          docker run --rm --network none \
            -v "$PWD/src/complydoc/sample:/documents:ro" -v "$RUNNER_TEMP/names:/reports" \
            complydoc:ci-names audit /documents --out /reports -q
          python3 - "$RUNNER_TEMP/reports/complydoc.json" "$RUNNER_TEMP/names/complydoc.json" <<'PY'
          import json, sys
          plain, names = (json.load(open(path))["aggregate"] for path in sys.argv[1:])
          assert "person_name" in plain["categories_not_scanned"], "the plain image scanned names"
          assert "person_name" not in names["categories_not_scanned"], names["categories_not_scanned"]
          found = names["sensitive_by_category"].get("person_name", 0)
          assert found > 0, "the image with a name model found no person names"
          print(f"{found} person names found")
          PY
      - name: the viewer is served read-only on the reports
        run: |
          docker run -d --name viewer -p 8612:8500 -v "$RUNNER_TEMP/reports:/reports:ro" complydoc:ci
          for _ in $(seq 30); do curl -sf http://localhost:8612/api/reports > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8612/api/reports | python3 -c "import json,sys; r=json.load(sys.stdin)['reports']; assert len(r) == 1, r; print(r[0]['name'])"
          curl -sf http://localhost:8612/ | grep -q '"readOnly": true'
          id=$(curl -sf http://localhost:8612/api/reports | python3 -c "import json,sys; print(json.load(sys.stdin)['reports'][0]['id'])")
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -H 'Origin: http://localhost:8612' -d '{"finding":"x","reason":"y"}' \
            "http://localhost:8612/api/reports/$id/ignores")
          test "$code" = 403
          # A name it was not given is refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: elsewhere.example' http://localhost:8612/api/reports)" = 403
          docker logs viewer
          docker rm -f viewer
      # The team set-up: its file is well formed, the proxy's image exists, and the
      # viewer comes up healthy with a read-only file system. Signing in needs an
      # identity provider, which this does not have.
      - name: the Compose file brings the viewer up healthy
        working-directory: deploy
        env:
          COMPLYDOC_HOST: reports.example.com
          COMPLYDOC_REPORTS: ${{ runner.temp }}/reports
          OIDC_ISSUER_URL: https://idp.example.com
          OIDC_CLIENT_ID: complydoc
          OIDC_CLIENT_SECRET: not-a-secret
          ALLOWED_EMAIL_DOMAINS: example.com
          COOKIE_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          docker compose config -q
          docker compose pull -q proxy
          docker compose up -d --no-build viewer
          for _ in $(seq 40); do
            state=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q viewer)")
            test "$state" = healthy && break
            sleep 2
          done
          docker compose logs viewer
          test "$state" = healthy
          # Under the name the proxy would pass on, and no other.
          docker compose exec -T viewer python -c "
          import urllib.request, urllib.error
          def ask(host):
              request = urllib.request.Request('http://127.0.0.1:8500/api/reports', headers={'Host': host})
              try:
                  return urllib.request.urlopen(request, timeout=5).status
              except urllib.error.HTTPError as error:
                  return error.code
          assert ask('reports.example.com') == 200, ask('reports.example.com')
          assert ask('elsewhere.example') == 403, ask('elsewhere.example')
          "
          docker compose down

  action:
    name: the GitHub Action runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: a policy the sample documents fail
        run: |
          printf 'version: 1\nrules:\n  no_hidden:\n    severity: medium\n' > "$RUNNER_TEMP/policy.yaml"
      # The action installs a released complydoc, so this checks the action's own
      # plumbing: inputs, outputs, the summary and the result. The tool itself is
      # tested above, and the action's scripts in src/tests/test_action.py.
      - uses: ./
        id: check
        with:
          path: src/complydoc/sample
          policy: ${{ runner.temp }}/policy.yaml
          args: --no-ocr
          comment: false
          fail: false
      - name: the failure was reported, not raised
        env:
          PASSED: ${{ steps.check.outputs.passed }}
          CODE: ${{ steps.check.outputs.exit-code }}
          SUMMARY: ${{ steps.check.outputs.markdown }}
        run: |
          test "$PASSED" = false
          test "$CODE" = 1
          grep -q "complydoc policy failed" "$SUMMARY"
