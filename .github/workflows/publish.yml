# Upload a release to PyPI, and publish its container images.
#
# Runs when a drafted release is published. Pushing a tag builds the artefacts,
# attests them and drafts the release; a version on PyPI cannot be replaced, so
# publishing is a manual step.
#
# The files uploaded are the ones attached to the release by `release.yml`.
#
# The container images are built from the tag's source and pushed to GitHub's registry,
# ghcr.io/complydoc/complydoc: `<version>` and `latest`, and `<version>-names` and `names`
# for the one with a name model, each for amd64 and arm64. They are then pulled back and
# run, so a release whose image does not work fails here and not on someone's server.
#
# Authentication is PyPI Trusted Publishing: GitHub proves this workflow's
# identity with a short-lived OIDC token and PyPI checks it against the
# publisher configured for the project. There is no token to store or rotate.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload, for a re-run"
        required: true

permissions:
  contents: read

jobs:
  pypi:
    name: upload to PyPI
    runs-on: ubuntu-latest
    # A GitHub environment, so the repository can require a review before this
    # runs and so the deployment is recorded.
    environment:
      name: pypi
      url: https://pypi.org/p/complydoc
    permissions:
      contents: read
      # Minting the OIDC token Trusted Publishing checks.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: take the wheel and sdist off the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir -p dist
          gh release download "${TAG}" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz'
          # The release also carries an SBOM and a checksum file. PyPI accepts
          # distributions only, so they are not downloaded.
          ls -l dist

      - name: the version being uploaded matches the tag
        env:
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          wheel=$(ls dist/*.whl)
          version="${TAG#v}"
          case "$(basename "${wheel}")" in
            complydoc-"${version}"-*) echo "${wheel} matches ${TAG}" ;;
            *) echo "::error::${wheel} is not version ${version} from tag ${TAG}"; exit 1 ;;
          esac

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run of a release that partly succeeded should not fail on the
          # files that already landed.
          skip-existing: true
          print-hash: true

  image:
    name: publish the container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing to this repository's package on ghcr.io.
      packages: write
      # Signing the build provenance attached to each image.
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - id: version
        name: the tag matches the packaged version
        run: |
          version="${TAG#v}"
          packaged=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/complydoc/__init__.py)
          if [ "${packaged}" != "${version}" ]; then
            echo "::error::tag ${TAG} is not version ${packaged} in complydoc/__init__.py"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: plain
        name: build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: plain
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: names
        name: build and push the image with a name model
        uses: docker/build-push-action@v6
        with:
          context: .
          target: names
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-names
            ${{ env.IMAGE }}:names
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

      - name: attest where the images were built
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.plain.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.names.outputs.digest }}
          push-to-registry: true

      # What was pushed, pulled back and run as anyone would run it.
      - name: the published images say this version and audit with no network
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for tag in "${VERSION}" "${VERSION}-names"; do
            docker pull -q "${IMAGE}:${tag}"
            said=$(docker run --rm "${IMAGE}:${tag}" --version)
            echo "${tag}: ${said}"
            case "${said}" in *"${VERSION}"*) ;; *) echo "::error::${IMAGE}:${tag} says ${said}"; exit 1 ;; esac
            out="${RUNNER_TEMP}/reports-${tag}"
            mkdir -p "${out}" && chmod 777 "${out}"
            docker run --rm --network none \
              -v "${PWD}/src/complydoc/sample:/documents:ro" -v "${out}:/reports" \
              "${IMAGE}:${tag}" audit /documents --out /reports -q
            test -s "${out}/complydoc.json"
          done
